<!doctype html>
<html lang="ru" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="База знаний по бухгалтерии: налоги, учёт, отчётность" />
    <title>База знаний по бухгалтерии</title>
    <script>
      // Тема применяется до первой отрисовки — иначе мигнёт светлым
      (function () {
        try {
          var stored = localStorage.getItem('baza-theme');
          var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
