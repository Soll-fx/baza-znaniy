name: Не давать сервису заснуть

# Render усыпляет бесплатный сервис после 15 минут без входящих запросов.
# Этот workflow шлёт запрос на /api/ping каждые 10 минут.
#
# Важно: пингуется именно /api/ping, а не /api/health. Эндпоинт /api/ping
# не обращается к базе, поэтому Neon продолжает засыпать через 5 минут
# простоя. У тарифа Free лимит 100 CU-часов в месяц, и непрерывная работа
# compute их исчерпает примерно за 17 суток. Обращение к базе при первом
# реальном запросе поднимает её за доли секунды.
#
# У самого Render лимит 750 instance-часов в месяц, непрерывная работа
# занимает 720. Второй такой сервис в этом же аккаунте не поместится.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Разбудить Render
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
              https://baza-znaniy-19im.onrender.com/api/ping || true)
            echo "попытка $i: HTTP ${code:-нет ответа}"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "сервис не отвечает, но это не ломает workflow"
