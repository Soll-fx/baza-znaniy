services:
  db:
    image: postgres:16-alpine
    container_name: baza-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: baza
      POSTGRES_PASSWORD: baza
      POSTGRES_DB: baza
      # Детерминированная сортировка — важна для ORDER BY по тексту
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baza -d baza"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
